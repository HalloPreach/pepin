[workspace]
resolver = "2"
members = ["core", "game", "niveaux", "robot"]

# Profil release orienté taille minimale (cible web / wasm)
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

# Les tests de faisabilité des niveaux simulent des millions de pas de physique :
# on les optimise pour qu'ils restent rapides (quelques secondes).
[profile.test]
opt-level = 2

# Profil des commandes `./docker-cargo.sh carte <clé>` et `lot` (carte 9.23, tri des
# tests). `--release` compile les tests avec le profil de la version web (taille
# minimale `z`, LTO, une seule unité : lent à compiler ET lent à exécuter) ; celui-ci
# vise la VITESSE des robots : optimisations complètes (`3`), sans LTO, compilation
# en parallèle. Mêmes calculs (Rust ne change pas les résultats des flottants selon
# le niveau d'optimisation) : seule la durée change.
[profile.tests-rapides]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
strip = false
panic = "unwind"

# Carte 10.3c : le robot de faisabilité compilé en wasm pour l'éditeur (crate
# `robot`, build de QA seulement). Le profil web `release` vise la TAILLE (`z`) ;
# celui-ci la VITESSE (`3`) : le robot simule des millions de pas dans le
# navigateur. `panic = "abort"` est hérité (le seul possible en wasm32).
[profile.robot-web]
inherits = "release"
opt-level = 3
