[package]
license = "MIT"
name = "core"
version = "0.1.0"
edition = "2021"
description = "Logique pure du jeu PÉPIN"

[dependencies]

[features]
# Quelques réglages réservés aux tests des vrais niveaux, qui vivent dans le crate
# `niveaux` (carte 10.1c) : voir `Pieuvre::fixer_pv_pour_les_tests`. Activée par
