[package]
license = "MIT"
name = "game"
version = "0.1.0"
edition = "2021"
description = "Jeu de plateformes PÉPIN (rendu macroquad)"

[dependencies]
pepin_core = { package = "core", path = "../core" }
macroquad = { version = "0.4", default-features = false }

[features]
# Son réel (quad-snd). Sur Linux natif il demande libasound (absente de l'image
# Docker rust:1-slim) : les tests natifs se lancent avec `--no-default-features`,
# la version web (wasm) garde le son par défaut.
default = ["son"]
son = ["macroquad/audio"]
# Raccourcis de mise au point : touches 1 à 5 pour sauter à un niveau (score et
# chrono remis à zéro). JAMAIS dans la production : sur AZERTY ce sont les touches
# & é " ' ( et un appui accidentel perdrait la partie. Activée seulement par
# `./build.sh --qa` (dist-qa/) pour les captures et la QA.
debug_niveaux = []
